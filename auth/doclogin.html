<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form id="authForm" class="sign-up">
            <h1 class="heading">Doctor Login</h1>
            <p class="conditions">Enter your credentials to log in</p>

            <div class="text">
                <img src="https://i.postimg.cc/DZBPRgvC/email.png" alt="icon" height="12">
                <input id="emailInput" type="email" placeholder="Email" required>
            </div>

            <div class="text">
                <img src="https://i.postimg.cc/Nj5SDK4q/password.png" alt="icon" height="20">
                <input id="passwordInput" type="password" placeholder="Password" required>
            </div>

            <p id="errorMessage" style="color: red; font-size: 14px;"></p>

            <button id="submitButton" type="submit">Sign In</button>
        </form>

        <div class="text-container">
            <h1>Glad to see you!</h1>
            <p>Welcome, please fill in the blanks to login</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        document.getElementById('authForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const submitButton = document.getElementById('submitButton');
            
            errorMessage.textContent = ''; // Reset error messages

            if (!email || !password) {
                errorMessage.textContent = 'Please enter both email and password.';
                return;
            }

            try {
                submitButton.disabled = true;
                submitButton.textContent = 'Logging in...';

                const response = await fetch('https://morgphealth.onrender.com/api/doctor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const result = await response.json();

                submitButton.disabled = false;
                submitButton.textContent = 'Sign In';

                if (response.ok && result.success) {
                    localStorage.setItem('doctorId', result.id); // Changed from doctor_id to doctorId
                    localStorage.setItem('token', result.token);

                    window.location.href = '../index.html';
                } else {
                    errorMessage.textContent = result.message || 'Login failed! Please check your credentials.';
                }
            } catch (error) {
                console.error('Error logging in:', error);
                errorMessage.textContent = 'An error occurred while trying to log in. Please try again later.';
                submitButton.disabled = false;
                submitButton.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
